name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'

    - name: Prepare files
      run: |
        mkdir -p gen/com/phoneproxy
        mkdir -p obj/com/phoneproxy
        mkdir -p bin
        mkdir -p bin/phone-proxy-apk
        mkdir -p res/layout
        mkdir -p src/com/phoneproxy

        # Если PhoneProxy.java лежит в корне — копируем
        if [ -f PhoneProxy.java ]; then
          cp PhoneProxy.java src/com/phoneproxy/PhoneProxy.java
        fi

        # Если main.xml лежит в корне — копируем
        if [ -f main.xml ]; then
          cp main.xml res/layout/main.xml
        fi

    - name: Build APK
      run: |
        AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
        D8="$ANDROID_HOME/build-tools/34.0.0/d8"
        ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"
        PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"

        # 1. Генерация R.java
        "$AAPT" package -f -m -J gen -M AndroidManifest.xml -S res -I "$PLATFORM"

        # 2. Компиляция Java
        javac -source 1.8 -target 1.8 -classpath "$PLATFORM" -d obj \
          gen/com/phoneproxy/R.java \
          src/com/phoneproxy/*.java

        # 3. DEX — все классы, включая R$...
        "$D8" --min-api 29 --output bin/ obj/com/phoneproxy/*.class

        # 4. Упаковка ресурсов
        "$AAPT" package -f -M AndroidManifest.xml -S res -I "$PLATFORM" -F bin/unsigned.apk

        # 5. Добавляем classes.dex
        (cd bin && zip -j unsigned.apk classes.dex)

        # 6. Zipalign ДО подписи
        "$ZIPALIGN" 4 bin/unsigned.apk bin/aligned.apk

        # 7. Ключ и подпись
        keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
          -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US" -noprompt

        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore debug.keystore -storepass android -keypass android \
          bin/aligned.apk androiddebugkey

        mv bin/aligned.apk bin/phone-proxy-apk/phone-proxy.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: phone-proxy-apk
        path: bin/phone-proxy-apk/phone-proxy.apk
