name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Build APK
      run: |
        mkdir -p gen/com/phoneproxy
        mkdir -p obj/com/phoneproxy
        mkdir -p bin
        mkdir -p bin/phone-proxy-apk
        mkdir -p res/layout
        
        # Полные пути к инструментам
        AAPT_PATH="$ANDROID_HOME/build-tools/34.0.0/aapt"
        D8_PATH="$ANDROID_HOME/build-tools/34.0.0/d8"
        ZIPALIGN_PATH="$ANDROID_HOME/build-tools/34.0.0/zipalign"
        PLATFORM_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
        
        # Компиляция ресурсов
        $AAPT_PATH package -f -m -J gen -M AndroidManifest.xml -S res -I $PLATFORM_JAR
        
        # Компиляция Java
        javac -classpath $PLATFORM_JAR -d obj gen/com/phoneproxy/R.java src/com/phoneproxy/PhoneProxy.java
        
        # Создание DEX
        $d8 --output bin/classes.dex obj/com/phoneproxy/PhoneProxy*.class
        
        # Упаковка APK
        $AAPT_PATH package -f -M AndroidManifest.xml -S res -I $PLATFORM_JAR -F bin/unsigned.apk
        
        cd bin
        zip -j unsigned.apk classes.dex
        cd ..
        
        # Подпись (debug)
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore debug.keystore -storepass android -keypass android bin/unsigned.apk androiddebugkey
        $ZIPALIGN_PATH 4 bin/unsigned.apk bin/phone-proxy-apk/phone-proxy.apk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: phone-proxy-apk
        path: bin/phone-proxy-apk/phone-proxy.apk
