name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Build APK
      run: |
        mkdir -p gen/com/phoneproxy
        mkdir -p obj/com/phoneproxy
        mkdir -p bin
        mkdir -p bin/phone-proxy-apk
        mkdir -p res/layout
        
        # НАХОДИМ ПРАВИЛЬНЫЕ ПУТИ АВТОМАТИЧЕСКИ
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "Build-tools versions:"
        ls $ANDROID_HOME/build-tools/
        
        # Берём первую доступную версию build-tools
        BT_VERSION=$(ls $ANDROID_HOME/build-tools/ | head -n1)
        echo "Using build-tools version: $BT_VERSION"
        
        BT_PATH="$ANDROID_HOME/build-tools/$BT_VERSION"
        AAPT_PATH="$BT_PATH/aapt"
        D8_PATH="$BT_PATH/d8"
        ZIPALIGN_PATH="$BT_PATH/zipalign"
        
        echo "AAPT_PATH: $AAPT_PATH"
        echo "D8_PATH: $D8_PATH"
        
        # Проверяем существование файлов
        ls -la $AAPT_PATH
        ls -la $D8_PATH
        
        # Находим android.jar
        PLATFORM_VERSION=$(ls $ANDROID_HOME/platforms/ | head -n1)
        PLATFORM_JAR="$ANDROID_HOME/platforms/$PLATFORM_VERSION/android.jar"
        echo "PLATFORM_JAR: $PLATFORM_JAR"
        
        # Компиляция ресурсов
        $AAPT_PATH package -f -m -J gen -M AndroidManifest.xml -S res -I $PLATFORM_JAR
        
        # Компиляция Java
        javac -classpath $PLATFORM_JAR -d obj gen/com/phoneproxy/R.java src/com/phoneproxy/PhoneProxy.java
        
        # Создание DEX
        cd obj
        $D8_PATH com/phoneproxy/*.class --output ../bin/classes.dex
        cd ..
        
        # Упаковка APK
        $AAPT_PATH package -f -M AndroidManifest.xml -S res -I $PLATFORM_JAR -F bin/unsigned.apk
        
        cd bin
        zip -j unsigned.apk classes.dex
        cd ..
        
        # Подпись (debug)
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore debug.keystore -storepass android -keypass android bin/unsigned.apk androiddebugkey
        $ZIPALIGN_PATH 4 bin/unsigned.apk bin/phone-proxy-apk/phone-proxy.apk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: phone-proxy-apk
        path: bin/phone-proxy-apk/phone-proxy.apk
